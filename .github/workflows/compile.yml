name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: extractions/setup-just@v4
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just references
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just references' and commit the changes."
            git diff
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install "Libertinus Serif"
        uses: SnO2WMaN/install-fontsource-action@v0.0.3
        with:
          font-name: Libertinus Serif
      - name: Install "Julia Mono"
        uses: SnO2WMaN/install-juliamono-action@v0.0.1
      - name: Install "New Computer Modern Mono"
        # fine-lncs が著者アドレスのメール表示に "New Computer Modern Mono" を
        # 直接指定しているが，Typst に同梱されているのは "New Computer Modern"
        # と "New Computer Modern Math" のみで Mono 版は同梱されていない．
        # CTAN 版 newcomputermodern パッケージのフォント名は
        # "NewComputerModern Mono"（スペース無し）なので，Typst 側が期待する
        # "New Computer Modern Mono" にリネームしてインストールする．
        run: |
          curl -sL https://mirrors.ctan.org/fonts/newcomputermodern.zip -o /tmp/newcm.zip
          unzip -q /tmp/newcm.zip -d /tmp/newcm
          pip install --quiet fonttools
          mkdir -p /tmp/newcm-mono
          for style in Regular Bold Italic BoldOblique; do
            python3 .github/scripts/rename-font-family.py \
              "NewComputerModern" "New Computer Modern" \
              "/tmp/newcm/newcomputermodern/otf/NewCMMono10-$style.otf" \
              "/tmp/newcm-mono/NewCMMono10-$style.otf"
          done
          sudo mkdir -p /usr/share/fonts/new-computer-modern-mono
          sudo cp /tmp/newcm-mono/*.otf /usr/share/fonts/new-computer-modern-mono/
          fc-cache -fv
      - uses: typst-community/setup-typst@v5.1.0
      - name: Check available fonts in Typst
        run: typst fonts
      - name: Compile main.typ
        run: |
          mkdir -p output
          typst compile main.typ output/main.pdf
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
